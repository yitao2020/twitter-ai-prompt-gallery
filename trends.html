ource visuals with AI Image → create different scenes with AI Video → bring them into CapCut PC → extend the moments that need more narrative space with AI Extend.\n\nThen AI Edit can handle local refinements, Edit Pilot can help with repetitive changes, and the multi-track timeline can finish the actual video.\n\nFor ", "author_name": "Naila | AI Insights", "author_handle": "Naila_Sync", "url": "https://x.com/i/status/2089794826183037284", "created_at": "Tue Aug 18 19:21:27 +0000 2026", "text_clean": "A short AI clip doesn’t always mean the idea is short. Seedance 2.5 1080p is now live on CapCut, but what matters to me is what happens after the AI video is generated. Batch-create source visuals wit…", "text_cn": "一个简短的AI视频并不总是意味着想法简短。Seedance 2.5 1080p现已在CapCut上线，但对我来说，重要的是AI视频生成之后会发生什么。批量创建源视觉素材 wit…"}], "photorealistic": [{"text": "AI JUST REPLACED THE ENTIRE ANIMATION PIPELINE\n\nwhat a studio used to spend $180,000 and 40 people on per episode:\n\n-\u003e script + shot list: Claude, 10 min\n-\u003e characters and sets: Midjourney, 20 min\n-\u003e motion, cartoon turned photoreal: Runway, 15 min\n-\u003e voices and sound: ElevenLabs, 10 min\n-\u003e score: Suno, 5 min\n-\u003e publish everywhere: CapCut, automatic\n\ntotal cost: $40 a month.\n\none person. one weekend to set up. a 60-year-old cartoon rebuilt as live-action that looks like it cost millions.\n\nbookma", "author_name": "Ridark", "author_handle": "ridark_eth", "url": "https://x.com/i/status/2088949524186202267", "created_at": "Sun Aug 16 11:22:32 +0000 2026", "text_clean": "AI JUST REPLACED THE ENTIRE ANIMATION PIPELINE what a studio used to spend $180,000 and 40 people on per episode: -\u003e script + shot list: Claude, 10 min -\u003e characters and sets: Midjourney, 20 min -\u003e mo…", "text_cn": "AI刚刚取代了整个动画制作流程，过去一个剧集工作室需要花费18万美元和40人：-\u003e 脚本和分镜：Claude，10分钟 -\u003e 角色和场景：Midjourney，20分钟 -\u003e 动作…"}, {"text": "Golden Hour CQC in Shibuya ☀️🥋 Tokyo streets are not for amateurs. \n\nA peaceful match, zero drift: soft rounded oval face, warm light-b…"}, {"text": "GPT image 2 on @openart_ai \n\nPrompt:\nPhotorealistic front-camera portrait of a young East Asian woman in a cozy indoor setting, captured from very close range. She has naturally long, straight ash-brown hair with soft volume, feathered ends, and full wispy bangs resting just above her eyebrows. Her warm brown eyes are wide and attentive, with subtle natural eye makeup, softly flushed cheeks, smooth realistic skin, and muted red-pink lips. A tiny delicate earring and a fine silver necklace with a", "author_name": "𝗦𝗮𝗻𝗶𝗮", "author_handle": "saniaspeaks_", "url": "https://x.com/i/status/2089929068628017198", "created_at": "Wed Aug 19 04:14:53 +0000 2026", "text_clean": "GPT image 2 on @openart_ai Prompt: Photorealistic front-camera portrait of a young East Asian woman in a cozy indoor setting, captured from very close range. She has naturally long, straight ash-brown…", "text_cn": "GPT Image 2 on @openart_ai Prompt: 照片级真实感正面镜头的年轻东亚女性肖像，场景为温馨的室内环境，从非常近的距离拍摄。她有自然的长直灰棕色……"}], "Nano Banana Pro": [{"text": "A 22-year-old guy built an AI influencer using Prism and scaled his Fanvue income to $6,400 in his first month\n\nPrism + Nano Banana 2 = automated content model\n\nThe only investment was a $20 subscription -\u003e the rest is pure profit\n\nMika fed Suki's core traits (20yo, blonde, hourglass body, no tattoos) into Prism Supercomputer Chat and generated a natural 4:5 mirror selfie wearing a red tank top and blue jeans via Nano Banana 2.\n\nInstead of keeping the original weaker reference, he deleted old Su", "author_name": "Ridark", "author_handle": "ridark_eth", "url": "https://x.com/i/status/2089002928744825084", "created_at": "Sun Aug 16 14:54:44 +0000 2026", "text_clean": "A 22-year-old guy built an AI influencer using Prism and scaled his Fanvue income to $6,400 in his first month Prism + Nano Banana 2 = automated content model The only investment was a $20 subscriptio…", "text_cn": "22岁的人用Pr 大象 • 香蕉……"}, {"text": "Ocean in a bowl. The fun part is how differently each model handles the water and the noodles.\n\n1. GPT Image 2.5 Sunburst\n2. Nano Banana 2\n3. Nano Banana Pro\n4. Flux 2 https://t.co/iYHUXg534i", "author_name": "Morphed", "author_handle": "morphedai", "url": "https://x.com/i/status/2097837464157393385", "created_at": "Thu Sep 10 00:00:02 +0000 2026", "text_clean": "Ocean in a bowl. The fun part is how differently each model handles the water and the noodles. 1. GPT Image 2.5 Sunburst 2. Nano Banana 2 3. Nano Banana Pro 4. Flux 2", "text_cn": "碗中的海洋。有趣的部分在于每个模型对水和面条的处理方式各不相同。1. GPT Image 2.5 Sunburst 2. Nano Banana 2 3. Nano Banana Pro 4. Flux 2"}, {"text": "We just made image models free for all existing and new annual users this September. Use GPT 2, Nano Banana Pro, and Nano Banana 2 - completely free. Whether you're using these models through the invideo agents, or manually accessing them inside invideo, no credits will be charged. Go crazy.", "author_name": "Invideo", "author_handle": "invideoOfficial", "url": "https://x.com/i/status/2098471752913563768", "created_at": "Fri Sep 11 18:00:28 +0000 2026", "text_clean": "We just made image models free for all existing and new annual users this September. Use GPT 2, Nano Banana Pro, and Nano Banana 2 - completely free. Whether you're using these models through the invi…", "text_cn": "我们刚刚为所有现有和新年度用户在九月免费提供图像模型。使用 GPT 2，Nano Banana Pro 和 Nano Banana 2 - 完全免费。无论您是通过 invi… 使用这些模型，"}, {"text": "China has just released a new image AI tool, and it's epic - maybe even better than Google's Nano Banana.\n\nWhile Nano Banana Pro was still loading, Z Image created 30 flawless images.\n\nGenerate in seconds:\n\n→ Selfies\n→ Anime characters\n→ Portraits\n→ ... https://t.co/FHPHFRPLKw", "author_name": "Anik Singal", "author_handle": "TeyllorK", "url": "https://x.com/i/status/2099032642008297945", "created_at": "Sun Sep 13 07:09:14 +0000 2026", "text_clean": "China has just released a new image AI tool, and it's epic - maybe even better than Google's Nano Banana. While Nano Banana Pro was still loading, Z Image created 30 flawless images. Generate in secon…", "text_cn": "中国刚刚发布了一款新的图像AI工具，简直太棒了——也许甚至比Google的Nano Banana更好。而Nano Banana Pro还在加载时，Z Image已经生成了30张完美的图像。Generate in secon…"}], "ComfyUI": [{"text": "ComfyUI 😃DLSS5-NR\n\nUnofficial, experimental ComfyUI integration for NVIDIA DLSS 5 Neural Rendering \n\nThe node runs Neural Rendering in-process inside ComfyUI through a small native D3D12 bridge\n\n👇\nhttps://t.co/pRLyvMlFqe https://t.co/McBLpl2fSi", "author_name": "Stable Diffusion Tutorials", "author_handle": "SD_Tutorial", "url": "https://x.com/i/status/2094846211262190044", "created_at": "Tue Sep 01 17:53:51 +0000 2026", "text_clean": "ComfyUI 😃DLSS5-NR Unofficial, experimental ComfyUI integration for NVIDIA DLSS 5 Neural Rendering The node runs Neural Rendering in-process inside ComfyUI through a small native D3D12 bridge 👇", "text_cn": "ComfyUI 😃DLSS5-NR 非官方、实验性 ComfyUI 集成，用于 NVIDIA DLSS 5 神经渲染 The 节点通过一个小的原生 D3D12 桥梁在 ComfyUI 内部运行 Neural Rendering 👇"}, {"text": "ComfyUI is the most used generative AI tool in the professional creative industry — used by teams at the largest studios in the world, like Netflix, Amazon, Nike, and more.\n\nThe barrier for non-technical creatives has always been the learning curve — python envs, model compatibility, debugging nodes, before you even touch a workflow. Now with Comfy MCP + agents, that barrier a lot lower.\n\nInstall Comfy Desktop + Comfy MCP, then just ask.\n→ tell your agent your hardware and to install MiniMax H3 ", "author_name": "rob - comfyui", "author_handle": "hellorob", "url": "https://x.com/i/status/2089788891771580435", "created_at": "Tue Aug 18 18:57:52 +0000 2026", "text_clean": "ComfyUI is the most used generative AI tool in the professional creative industry — used by teams at the largest studios in the world, like Netflix, Amazon, Nike, and more. The barrier for non-technic…", "text_cn": "ComfyUI 是专业创意行业中使用最广泛的生成式 AI 工具 —— 被 Netflix、Amazon、Nike 等全球顶级工作室的团队所使用。非技术用户…"}, {"text": "ComfyUI can now split a flat image into separate editable layers and hand you a PSD that opens straight in Photoshop. Thanks to Node 2.0.\n\nThe new layer nodes come from Terry (@jtydhr88) on our frontend team. A compositor editor is right in the graph, so you can arrange everything before you ever leave ComfyUI.\n\nHow it works:\n- Run the Seedream 5.0 layer separation template in Comfy Cloud\n- Add multiple images into the layers\n- Arrange and composite them in the editor\n- Export every layer to a P", "author_name": "JO. Z", "author_handle": "jojodecayz", "url": "https://x.com/i/status/2090140149426626708", "created_at": "Wed Aug 19 18:13:39 +0000 2026", "text_clean": "ComfyUI can now split a flat image into separate editable layers and hand you a PSD that opens straight in Photoshop. Thanks to Node 2.0. The new layer nodes come from Terry (@jtydhr88) on our fronten…", "text_cn": "ComfyUI 现在可以将一张扁平图像拆分成单独的可编辑图层，并直接给你一个 PSD 文件，可以直接在 Photoshop 中打开。感谢 Node 2.0。新的图层节点来自 Terry（@jtydhr88）在我们的 fronten…"}, {"text": "Qwen Image 3.0 Pro is live in ComfyUI via Partner Nodes.\n\n→ 4,500-token prompts (4.5x the last gen)\n→ Legible text down to ~10px\n→ 12 languages · 20+ fonts · 100+ styles\n→ Formulas, diagrams, nested UI mockups\n→ Multi-image editing\n\nQwen is turning image generation into a tool for posters, slides, infographics, and product design.\n\nClick the link below to try it today 👇", "author_name": "ComfyUI", "author_handle": "ComfyUI", "url": "https://x.com/i/status/2091208843200270369", "created_at": "Sat Aug 22 17:00:15 +0000 2026", "text_clean": "Qwen Image 3.0 Pro is live in ComfyUI via Partner Nodes. → 4,500-token prompts (4.5x the last gen) → Legible text down to ~10px → 12 languages · 20+ fonts · 100+ styles → Formulas, diagrams, nested UI…", "text_cn": "Qwen Image 3.0 Pro已在ComfyUI通过合作伙伴节点上线。→ 4,500-token提示词（是上一代的4.5倍）→ 可读文本可缩小至~10px → 12种语言 · 20多种字体 · 100多种风格 → 公式、示意图、嵌套UI…"}, {"text": "MiniMax H3 🎬📽️🎞️ Director Cut Studio\n in ComfyUI\n\nAdobe Premiere inspired PySide6 director studio for MiniMax H3 Ref2VA with AI shot planning, semantic media enrichment,timeline prompt reconciliation and shot-aware long-video rendering through ComfyUI\n\n👇\nhttps://t.co/nLT3Az9aof https://t.co/1zg9pouo7n", "author_name": "Stable Diffusion Tutorials", "author_handle": "SD_Tutorial", "url": "https://x.com/i/status/2092934847191044415", "created_at": "Thu Aug 27 11:18:47 +0000 2026", "text_clean": "MiniMax H3 🎬📽️🎞️ Director Cut Studio in ComfyUI Adobe Premiere inspired PySide6 director studio for MiniMax H3 Ref2VA with AI shot planning, semantic media enrichment,timeline prompt reconciliation an…", "text_cn": "MiniMax H3 🎬📽️🎞️ ComfyUI Adobe Premiere 风格的导演剪辑室，为 MiniMax H3 Ref2VA 提供 AI 拍摄规划，语义媒体丰富化，时间轴提示词协调 an…"}, {"text": "ComfyUI Tutorial for Beginners: Text-to-Image \u0026 Image-to-Image Workflows\n\nOne graph, two workflows and Module 2 is where you build it node by node instead of loading someone else's.\n\nWe start from a blank canvas and wire every connection, then change a single value and turn the same graph into image-to-image.\n\nWhat you'll learn:\n\n→ The 5 core nodes, connected one at a time — checkpoint, CLIP encode, KSampler, empty latent, VAE decode\n→ Why the data flows the way it does, not just where the wires", "author_name": "ComfyUI", "author_handle": "ComfyUI", "url": "https://x.com/i/status/2094506831754486128", "created_at": "Mon Aug 31 19:25:17 +0000 2026", "text_clean": "ComfyUI Tutorial for Beginners: Text-to-Image \u0026 Image-to-Image Workflows One graph, two workflows and Module 2 is where you build it node by node instead of loading someone else's. We start from a bla…", "text_cn": "ComfyUI 入门教程：文本到图像 \u0026 图像到图像工作流程  \nOne graph, two workflows and Module 2 is where you build it node by node instead of loading someone else's. We start from a bla…"}], "prompt engineering": [{"text": "🚨 Harvard just made its AI course nd a small tray sits within reach on her right. Her knees extend beyond the seat edge and her booted", "author_name": "Loriel.AI", "author_handle": "ou_zhen599", "url": "https://x.com/i/status/2097274253179806124", "created_at": "Tue Sep 08 10:42:02 +0000 2026", "text_clean": "Made with MiniMax-H3 ComfyUI Image-to-Video🚀“Passing the time in the space capsule—yes, this is the life I love.” MiniMax-H3 prompt👇 integrated_multimodal_description: [Shot 1] A 15-second photorealis…", "text_cn": "由MiniMax-H3 ComfyUI图像到视频🚀“在胶囊舱中度过时光——是的，这就是我热爱的生活。”MiniMax-H3提示词👇 integrated_multimodal_description: [镜头1] 15秒的照片级真实感…"}, {"text": "V2 experiment update: Continue experimenting with using existing AI tools to create short animated . based on the content of a one-page comic.With my Claude weekly cap hit and GPT credits burning fast, I tried Gemini 3.8 Flash expecting very little. To my surprise, it now runs my ComfyUI pipeline end-to-end while I handle the concepts and review outputs. I also swapped Nano Banana for GPT Image 2.5. Shots are cleaner, and consistency is steadier. Iterating on prompts and workflow helped lock war", "author_name": "niceniceboy_", "author_handle": "FallenA01590521", "url": "https://x.com/i/status/2097639785464770743", "created_at": "Wed Sep 09 10:54:31 +0000 2026", "text_clean": "V2 experiment update: Continue experimenting with using existing AI tools to create short animated . based on the content of a one-page comic.With my Claude weekly cap hit and GPT credits burning fast…", "text_cn": "V2实验更新：继续尝试使用现有AI工具，基于一页漫画内容创作短动画。随着我的Claude周限额用尽，GPT信用额度也快耗尽……"}, {"text": "ComfyUI for Advertising: Storyboards \u0026 Style Frames from a Shot List\n\nShot list → storyboard → style frames. Two passes, one graph.\n\nPass 1: type your shots into the shot list node. GPT Image returns all 9 panels as a single sketch sheet, plus each panel saved out on its own. Product image optional as reference.\n\nPass 2: hand that sheet + a mood board to Nano Banana Pro. Every panel comes back as commercial photography, graded to your board.\n\nWorks with hand-drawn boards too.", "author_name": "ComfyUI", "author_handle": "ComfyUI", "url": "https://x.com/i/status/2098119635631845576", "created_at": "Thu Sep 10 18:41:16 +0000 2026", "text_clean": "ComfyUI for Advertising: Storyboards \u0026 Style Frames from a Shot List Shot list → storyboard → style frames. Two passes, one graph. Pass 1: type your shots into the shot list node. GPT Image returns al…", "text_cn": "ComfyUI 用于广告：从分镜头表生成分镜和风格帧 分镜头表 → 分镜 → 风格帧。两遍，一个图。第一遍：将你的镜头输入分镜头表节点。GPT Image 返回 al…"}, {"text": "From an idea to a complete AI video \n\nCreated the AI influencer with @apob_ai, then brought the concept to life with GPT Image 2.0 + Seedance 2.5.\n\nSimple idea, cinematic result. https://t.co/3b1x2Kmn6b", "author_name": "Malika Ai", "author_handle": "ch_h234", "url": "https://x.com/i/status/2098344936932618453", "created_at": "Fri Sep 11 09:36:32 +0000 2026", "text_clean": "From an idea to a complete AI video Created the AI influencer with @apob_ai, then brought the concept to life with GPT Image 2.0 + Seedance 2.5. Simple idea, cinematic result.", "text_cn": "从一个想法到一个完整的AI视频  \n创建了@apob_ai的AI网红，然后用GPT Image 2.0 + Seedance 2.5将概念变为现实。简单的想法，电影感的结果。"}, {"text": "Want to see how far AI video generation has come?\n\nI’m testing Seedance 2.5 on @WizstarAI with a multi-reference prompt to create a photorealistic Hollywood-style monster action sequence.\n\n15s vertical video\nConsistent monster\nConsistent city\n4-person squad\nExplosions + destruction\nDynamic cinematic camera movement\n\nThe prompt is doing everything from aerial shots and helicopter attacks to vehicle destruction and a final city-wide explosion.\n\nNow I want to see what YOU can create.\n\n👉 Try this ex", "author_name": "Meenakshi Yadav", "author_handle": "MeenakshiYACS", "url": "https://x.com/i/status/2098803826405089450", "created_at": "Sat Sep 12 16:00:00 +0000 2026", "text_clean": "Want to see how far AI video genera   nodes.length=0;edges.length=0;byId.clear();

    add({id:'k:'+keyword, key:keyword, name:data.names[keyword] || keyword, type:data.types[keyword] || 'concept', values:data.series[keyword], related:[], tweets:(data.keyword_tweets || {})[keyword] || []});
  }

  function el(tag, attrs, text) {

    for(const edge of edges) edge.element.style.display=edge.enabled!==false&&visible.has(edge.source.id)&&visible.has(edge.target.id)?'':'none';
    for(const ring of $('regions').children) ring.style.display=visible.has(ring.dataset.parent)?'':'none';
    $('node-count').textContent=visible.size;$('hot-count').textContent=primary.filter(n=>n.hot&&visible.has(n.id)).length;
    $('empty').hidden=visible.size>0;
    if(selected&&!visible.has(selected)) closePanel(false);
    renderGenreOverview();
    wake();
  }
  function select(id) {
    selected=id;const node=byId.get(id);
    const neighbors=new Set([id,...(node.parents||node.related)]);
    for(const n of nodes){n.element.classList.toggle('dim',!neighbors.has(n.id));n.element.classList.toggle('connected',neighbors.has(n.id));n.element.classList.toggle('selected',n.id===id);n.element.setAttribute('aria-pressed',String(n.id===id));}
    for(const edge of edges){const active=edge.source.id===id||edge.target.id===id;edge.element.classList.toggle('active',active);edge.element.classList.toggle('dim',!active);}
    renderPanel(node);$('panel').hidden=false;$('genre-overview').hidden=true;
  }
  function renderGenreOverview() {
    const box=$('genre-overview');
    box.hidden=mode!=='technique'||filter!=='genre'||Boolean(selected);
    if(box.hidden)return;
    const total=sum(data.corpus.slice(-period)),covered=sum((data.genre_covered||[]).slice(-period));
    const ranked=primary.filter(n=>n.type==='genre'&&visible.has(n.id)).sort((a,b)=>b.total-a.total);
    box.innerHTML=`<div class="eyebrow">GENRE / 题材风向</div><h2>哪些故事被提到？</h2><p class="note">近 ${period} 天 ${total} 条样本中，${covered} 条命中明确题材词，${total-covered} 条未归类。占比以全部样本为分母，同一样本可有多个题材。</p><div class="genre-ranking">`+
      ranked.map((n,i)=>`<button data-genre="${esc(n.id)}"><span class="rank-number">${String(i+1).padStart(2,'0')}</span><span>${esc(n.name)}<i style="width:${n.total/Math.max(1,ranked[0].total)*100}%"></i></span><b>${n.total} 条<small>${total?(n.total/total<.01?'&lt;1':Math.round(n.total/total*100)):0}%</small></b></button>`).join('')+
      `</div><p class="note">这是本站提示词中的题材线索，包含单帧图像与片段描述，不等于已制作的影视剧数量或行业市场份额。${query?'当前榜单按搜索词筛选。':''}</p>`;
    box.querySelectorAll('[data-genre]').forEach(button=>button.onclick=()=>select(button.dataset.genre));
  }
  function renderPanel(node) {
    if(mode==='technique'){renderTechnique(node);return;}
    const topic=node.type==='topic', values=(node.values||[]).slice(-period);
    const delta=node.delta===null?'—':`${node.delta>0?'+':''}${Math.round(node.delta)}%`;
    const related=topic?node.parents:node.related;
    const tweets=topic?node.parents.flatMap(id=>byId.get(id).tweets).filter(t=>(t.text||'').toLowerCase().includes(node.key.toLowerCase())):node.tweets;
    const unique=[...new Map(tweets.map(t=>[t.url||t.text,t])).values()].slice(0,6);
    const max=Math.max(1,...values), points=values.map((v,i)=>`${i/Math.max(1,values.length-1)*280},${70-v/max*62}`).join(' ');
    $('panel-content').innerHTML=`<div class="eyebrow">${typeNames[node.type]}</div><h2>${esc(node.name)}</h2><div class="original">${esc(node.key)}</div>`+
      (topic?`<div class="metrics"><div><b>${related.length}</b><span>关联关键词</span></div><div><b>${fmt(node.count)}</b><span>累计共现次数</span></div></div><p class="note">共现次数为整批数据中各关键词关联计数之和，可能包含重复推文。</p>`:
      `<div class="metrics"><div><b>${fmt(node.total)}</b><span>近 ${period} 天提及</span></div><div><b>${fmt(node.last)}</b><span>最新一天</span></div><div><b class="${node.hot?'accent':''}">${delta}</b><span>较前一天</span></div></div><div class="panel-label">MENTIONS / 每日采样提及</div><svg class="spark" viewBox="0 0 280 80" role="img" aria-label="最近${values.length}天提及次数：${values.join('、')}"><path d="M0 74H280" stroke="#454638"/><polyline points="${points}" fill="none" stroke="#ff591d" stroke-width="2"/></svg><div class="spark-labels"><span>${esc(data.dates.slice(-period)[0]||'')}</span><span>${esc(data.dates.at(-1)||'')}</span></div>`)+
      `<div class="panel-label">CONNECTIONS / ${topic?'相关关键词':'关联热词'}</div><div class="chips">${related.map(id=>`<button data-node="${esc(id)}">${esc(byId.get(id).name)} ↗</button>`).join('')||'<span class="note">暂无关联数据</span>'}</div><div class="panel-label">FROM X / 代表性推文</div>`+
      (unique.map(t=>{let url='';try{const parsed=new URL(t.url);if(parsed.protocol==='https:'&&['x.com','twitter.com','www.x.com','www.twitter.com'].includes(parsed.hostname))url=parsed.href;}catch{}return `<article class="tweet"><p>${esc(t.text_cn||t.text_clean||t.text)}</p>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">@${esc(t.author_handle||t.author_name||'作者')} · 查看原文 ↗</a>`:''}</article>`;}).join('')||'<p class="note">当前采样中暂无可展示的代表推文。</p>')+
      `<p class="note">采样统计 · 截至 ${esc(data.dates.at(-1)||'暂无数据')}<br>关联热词与推文取自整批采集数据。</p>`;
    for(const button of $('panel-content').querySelectorAll('[data-node]')) button.addEventListener('click',()=>{
      filter='all';query='';$('search').value='';syncFilters();applyFilter();select(button.dataset.node);$('panel').scrollTop=0;
    });
  }
  function renderTechnique(node) {
    const values=node.values.slice(-period),total=sum(data.corpus.slice(-period));
    const share=total?(node.total>0&&node.total/total<.01?'&lt;1':Math.round(node.total/total*100)):0;
    const start=data.dates.slice(-period)[0],end=data.dates.at(-1);
    const examples=(data.examples[node.key]||[]).filter(e=>e.date>=start&&e.date<=end).sort((a,b)=>b.date.localeCompare(a.date));
    const connections=edges.filter(e=>e.count>=2&&(e.source===node||e.target===node)).sort((a,b)=>b.count-a.count).slice(0,8);
    const max=Math.max(1,...values),points=values.map((v,i)=>`${i/Math.max(1,values.length-1)*280},${70-v/max*62}`).join(' ');
    $('panel-content').innerHTML=`<div class="eyebrow">${typeNames[node.type]}</div><h2>${esc(node.name)}</h2><p class="technique-description">${esc(data.descriptions[node.key])}</p><div class="metrics"><div><b>${fmt(node.total)}</b><span>命中样本</span></div><div><b>${share}%</b><span>所选样本占比</span></div><div><b>${fmt(node.last)}</b><span>最新一天</span></div></div><div class="panel-label">SAMPLES / 按原文发布日期统计</div><svg class="spark" viewBox="0 0 280 80" role="img" aria-label="最近${values.length}天样本数：${values.join('、')}"><path d="M0 74H280" stroke="#454638"/><polyline points="${points}" fill="none" stroke="#ff591d" stroke-width="2"/></svg><div class="spark-labels"><span>${esc(start)}</span><span>${esc(end)}</span></div><div class="panel-label">PAIRS / 同一提示词中的搭配</div><div class="chips">`+
      (connections.map(edge=>{const other=edge.source===node?edge.target:edge.source;return `<button data-node="${esc(other.id)}">${esc(other.name)} · ${edge.count} 条 ↗</button>`;}).join('')||'<span class="note">当前区间内暂无重复出现的搭配。</span>')+
      `</div><div class="panel-label">EVIDENCE / 原文片段 · ${examples.length} 条中展示 ${Math.min(6,examples.length)} 条</div>`+
      examples.slice(0,6).map(example=>{
        let url='';try{const u=new URL(example.url);if(u.protocol==='https:'&&['x.com','twitter.com','www.twitter.com','www.x.com','www.xiaohongshu.com','xiaohongshu.com','reddit.com','www.reddit.com'].includes(u.hostname))url=u.href;}catch{}
        const offset=example.excerpt.indexOf(example.matched);
        const excerpt=offset<0?esc(example.excerpt):esc(example.excerpt.slice(0,offset))+'<mark>'+esc(example.matched)+'</mark>'+esc(example.excerpt.slice(offset+example.matched.length));
        return `<article class="tweet"><div class="evidence-meta">${esc(example.source)} · ${esc(example.date)}</div><p class="evidence-title">${esc(example.title)}</p><blockquote>…${excerpt}…</blockquote>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(example.author_name||'原作者')} · 查看完整原文 ↗</a>`:''}</article>`;
      }).join('')+`<p class="note">技法说明为编辑整理；计数和片段来自本站收录文本，提及不代表采用或效果验证。稀少样本不宜解读为整体趋势。</p>`;
    for(const button of $('panel-content').querySelectorAll('[data-node]'))button.onclick=()=>{filter='all';query='';$('search').value='';syncFilters();applyFilter();select(button.dataset.node);$('panel').scrollTop=0;};
  }
  function configureView() {
    const technique=mode==='technique';
    document.body.classList.toggle('technique-view',technique);
    const categories=technique?['genre','shot','composition','motion','lighting','color','story','constraint']:['model','tool','style','concept','topic'];
    document.querySelector('.filters').innerHTML='<button data-filter="all" aria-pressed="true">全部</button>'+categories.map(key=>`<button data-filter="${key}" aria-pressed="false">${typeNames[key].split(' / ')[0]}</button>`).join('');
    document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;syncFilters();applyFilter();});
    $('view-mode').value=mode;$('range').value=String(period);
    $('map-title').innerHTML=technique?'看见创作的细节<span>。</span>':'灵感有迹可循<span>。</span>';
    $('map-description').textContent=technique?'运镜、景别、光线、构图与节奏，从提示词中找线索。':'从热门模型到创作技法，探索话题之间的连接。';
    $('edition').textContent=technique?'PROMPT / CREATIVE FOCUS':'X / TWITTER SIGNALS';
    $('search').placeholder=technique?'搜索技法：特写 / dolly / 逆光':'搜索关键词 / 关联话题';
    $('updated').textContent=technique?data.updated_at:'更新 '+(data.updated_at||'未知');
    $('about-date').textContent=technique?'统计截至最近收录记录的发布日期：'+data.dates.at(-1):'最近采集更新：'+(data.updated_at||'未知');
    $('methodology').innerHTML=technique?`<p>${esc(data.method)}</p><p>按原文发布日期划分最近 7 / 30 天；节点大小表示命中样本数，橙色表示最后一天的样本数高于前一天，不代表全平台热度上升。</p><p>同一条文本中的技法构成共现关系，至少 2 条样本才建立连线；图中保留每个节点最强的 3 组搭配，详情列出更多。节点、占比、连线和证据均随时间范围变化。</p><p>技法分类由人工整理的规则识别，可能漏掉隐含表达；中英文近义表达合并。已去重但不同描述的转载仍可能保留，采样存在来源和收录偏差。</p>`:'<p>节点大小表示所选区间的采样提及次数，橙色表示最新一天高于前一天。</p><p>连线表示关键词与关联热词在推文中的共现；关联热词按整批采集数据统计，不随时间筛选变化。</p><p>来自最近一次采集，不是实时或全平台热榜。</p>';
    document.querySelector('.legend').innerHTML=technique?'<span><i class="orange"></i>单日提及增加</span><span>大小 = 样本数</span><span>连线 = 同文共现 ≥ 2</span><span>悬停显示名称</span>':'<span><i class="orange"></i>热度上升</span><span><i class="warm"></i>持续讨论</span><span>○ 模型</span><span>□ 工具</span><span>◇ 风格</span><span>⬡ 概念</span><span>· 关联话题</span>';
  }
  function closePanel(focus=true) {
    const previous=selected;selected=null;$('panel').hidden=true;
    for(const node of nodes){node.element.classList.remove('dim','selected','connected');node.element.setAttribute('aria-pressed','false');}
    for(const edge of edges) edge.element.classList.remove('dim','active');
    if(focus&&previous)byId.get(previous).element.focus();
    renderGenreOverview();
  }
  function syncFilters(){for(const button of document.querySelectorAll('[data-filter]'))button.setAttribute('aria-pressed',String(button.dataset.filter===filter));}
  function transform(){ $('scene').setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);$('zoom-label').textContent=Math.round(scale*100)+'%';}
  function zoom(factor,x=width/2,y=height/2){const next=Math.max(.45,Math.min(3,scale*factor));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform();}
  function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());}
  function start(e,node=null){if(e.button!==0||pointer)return;e.stopPropagation();moved=false;const p=point(e);pointer={id:e.pointerId,node,x:p.x,y:p.y,startX:p.x,startY:p.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');if(node){node.vx=0;node.vy=0;wake();}}
  svg.addEventListener('pointerdown',e=>start(e));
  svg.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=point(e),dx=p.x-pointer.x,dy=p.y-pointer.y;if(Math.hypot(p.x-pointer.startX,p.y-pointer.startY)>4)moved=true;if(moved){if(pointer.node){pointer.node.x+=dx/scale;pointer.node.y+=dy/scale;positions();}else{tx+=dx;ty+=dy;transform();}}pointer.x=p.x;pointer.y=p.y;});
  svg.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const node=pointer.node;pointer=null;svg.classList.remove('dragging');svg.releasePointerCapture(e.pointerId);if(node)wake();if(!moved&&node)select(node.id);else if(!moved)closePanel(false);});
  function cancelDrag(){pointer=null;svg.classList.remove('dragging');wake();}
  svg.addEventListener('pointercancel',cancelDrag);
  svg.addEventListener('lostpointercapture',()=>{if(pointer)cancelDrag();});
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(Math.exp(-e.deltaY*.001),p.x,p.y);},{passive:false});
  $('zoom-in').onclick=()=>zoom(1.2);$('zoom-out').onclick=()=>zoom(1/1.2);
  $('reset').onclick=()=>{scale=1;tx=ty=0;layout();positions();transform();wake();};
  $('close').onclick=()=>closePanel();
  document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;syncFilters();applyFilter();});
  $('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();applyFilter();});
  $('clear').onclick=()=>{filter='all';query='';$('search').value='';syncFilters();applyFilter();};
  function updatePeriod(){metrics();layout();draw();const dates=data.dates.slice(-period);$('date-range').textContent=dates.length?`${dates[0].slice(5)} — ${dates.at(-1).slice(5)} · UTC`: '暂无数据';$('sample-count').textContent=mode==='technique'?`本站样本 ${fmt(sum(data.corpus.slice(-period)))} 条 · 去重后按原文日期统计`:'';if(selected)select(selected);}
  $('range').onchange=e=>{period=Number(e.target.value);updatePeriod();};
  $('view-mode').onchange=e=>{pause();closePanel(false);pointer=null;mode=e.target.value;data=mode==='technique'?snapshots.techniques:snapshots;filter='all';query='';$('search').value='';scale=1;tx=ty=0;transform();loadNodes();configureView();updatePeriod();};
  $('about').onclick=()=>$('about-dialog').showModal();$('close-about').onclick=()=>$('about-dialog').close();
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('about-dialog').open)closePanel();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus();}});
  let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{layout();positions();scale=1;tx=ty=0;transform();wake();},120);});
  loadNodes();configureView();updatePeriod();
})();
</script>
</body>
</html>
